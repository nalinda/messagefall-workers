name: Bun Install
description: Install dependencies with Bun

runs:
  using: "node"
  min: "20"
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: "bun"

    - uses: oven/bun@v3
      with:
        bun-version: 1.4.0

    - name: Install dependencies
      run: bun install
      env:
        CI: true
