name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/bun-install
      - name: Run lint
        run: bun run lint

  types:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/bun-install
      - name: Type check
        run: bun run ts-check

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/bun-install
      - name: Build
        run: bun run build

  format:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/bun-install
      - name: Format check
        run: bun run format:check

  exports:
    name: Export verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/bun-install
      - name: Run export tests
        run: bun run test:exports

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/bun-install
      # `bun test` picks up test/integration/ too, and that suite is slow (it boots
      # wrangler dev). The `integration` job below is the one place it runs in CI.
      - name: Run tests
        run: bun run test -- --path-ignore-patterns='**/test/integration/**'

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/bun-install
      # No build step: the harness resolves the library through tsconfig `paths`
      # into src/, never dist/, so a build here would change nothing.
      - name: Run integration tests
        run: bun run test:integration
