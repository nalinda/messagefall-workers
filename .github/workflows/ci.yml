name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    name: Install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Bun
        uses: oven/bun@v3
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/bun-install
      - name: Run lint
        run: bun run lint

  types:
    name: Type check
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/bun-install
      - name: Type check
        run: bun run ts-check

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/bun-install
      - name: Build
        run: bun run build

  format:
    name: Format check
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/bun-install
      - name: Format check
        run: bun run format:check

  exports:
    name: Export verification
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/bun-install
      - name: Run export tests
        run: bun run test:exports

  tests:
    name: Tests
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/bun-install
      - name: Run tests
        run: bun run test

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: build
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      INTEGRATION_BACKENDS: hyperdrive
      INTEGRATION_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/bun-install
      - name: Run integration tests
        run: bun run test:integration
